services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    restart: unless-stopped

    ports:
      - "32400:32400"

    environment:
      - PLEX_UID=1000
      - PLEX_GID=1000
      - TZ=America/New_York
      - PLEX_CLAIM=claim-ax39zMBi4sJ36Wy6rPTa

    volumes:
      - ./config:/config
      - ./transcode:/transcode
      - /d/Plex:/data